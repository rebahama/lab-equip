{% extends "webpage/base.html" %}
{% block title %}Create Booking{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="mb-4">
                        Book Equipment
                    </h1>
                    <div class="mb-4">
                        <p class="text-muted mb-0">
                            You are about to book {{ equipment.equipment_type.name }} with Serial number: {{ equipment.serial_number }}
                        </p>
                    </div>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="start_time" class="form-label">
                                Start time
                            </label>
                            <input type="datetime-local" name="start_time" id="start_time" class="form-control"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="end_time" class="form-label">
                                End time
                            </label>
                            <input type="datetime-local" name="end_time" id="end_time" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label for="purpose" class="form-label">
                                Purpose
                            </label>
                            <textarea name="purpose" id="purpose" class="form-control" rows="4" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary btn-sm w-100 rounded-pill equipment-button">
                            <i class="fa-solid fa-calendar-plus me-1"></i>
                            Request Booking
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
