{% extends "webpage/base.html" %} {% block title %}Logout{% endblock %} {% block content %} <div
    class="row justify-content-center">
    <div class="logout-page">
        <div class="logout-card">
            <h1>Logout</h1>
            <p>Are you sure you want to log out?</p>
            <div class="logout-button-area">
                <form method="post" action="{% url 'account_logout' %}"> {% csrf_token %}
                    <a href="/" class="btn btn-secondary rounded-pill px-4">
                        <i class="fa-solid fa-arrow-left"></i> Back </a>
                    <button type="submit" class="btn btn-success rounded-pill px-4"> <i
                            class="fa-solid fa-right-from-bracket"></i>
                        Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
    {% endblock %}
