{% extends "webpage/base.html" %} {% block title %}Logout{% endblock %} {% block content %} <div
    class="row justify-content-center">
    <div class="logout-page">
        <div class="logout-card">
            <h1>Logout</h1>
            <p>Are you sure you want to log out?</p>
            <form method="post" action="{% url 'account_logout' %}"> {% csrf_token %} <button type="submit"
                    class="logout-button"> <i class="fa-solid fa-right-from-bracket"></i> Logout </button> </form> <a
                href="/" class="cancel-link"> <i class="fa-solid fa-circle-xmark"></i> Cancel </a>
        </div>
    </div>
</div> {% endblock %}
