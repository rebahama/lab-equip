{% extends "webpage/base.html" %}{% block title %}Login{% endblock %} {% block content %} <div
    class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h1 class="text-center mb-4">Login</h1>
        <form method="post" action="{% url 'account_login' %}"> {% csrf_token %} {{ form.as_p }} <button type="submit"
                class="btn btn-primary w-100"> Login </button> </form>
        <div class="text-center mt-3">
            <p> Don't have an account? <a href="{% url 'account_signup' %}">Register</a> </p>
        </div>
    </div>
</div> {% endblock %}
