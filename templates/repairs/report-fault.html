{% extends "webpage/base.html" %} {% block title %}Report fault{% endblock %} {% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4"> <i class="fa-solid fa-screwdriver-wrench"></i> Report Fault </h1>
            <p class="text-muted"> Report a problem with: {{ equipment.equipment_type }}, Serial number:
                {{ equipment.serial_number }} </p>
            <form method="post"> {% csrf_token %} <div class="mb-3"> <label for="problem" class="form-label">
                        <strong>Describe the problem</strong> </label> <textarea name="problem" id="problem"
                        class="form-control" rows="5" placeholder="Describe what is wrong with the equipment..."
                        required></textarea> </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary rounded-pill"> <i class="fa-solid fa-paper-plane"></i>
                        Report Fault </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
